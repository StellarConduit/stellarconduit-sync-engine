[package]
name = "stellarconduit-sync-engine"
version = "0.1.0"
edition = "2021"
description = "Offline transaction queue, conflict resolution, and settlement tracking for StellarConduit"
license = "Apache-2.0"

[lib]
# `cdylib` and `staticlib` are needed alongside `rlib` so `src/ffi.rs`'s
# `#[no_mangle] extern "C"` functions are actually exported as linkable
# symbols for mobile consumers: `cdylib` produces the shared object Android/
# JNI links against, `staticlib` produces the archive iOS links against, and
# `rlib` keeps this crate usable as an ordinary Rust dependency (e.g. from
# this crate's own `tests/`). Mirrors `stellarconduit-core`'s `[lib]` section,
# which needs `cdylib` for the same reason (its own `src/ffi.rs`).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Shared mesh envelope types, signing, and relay-chain proofs
stellarconduit-core = { git = "https://github.com/StellarConduit/stellarconduit-core.git", rev = "da4c057" }

# Stellar transaction XDR parsing.
#
# We derive the true source account and sequence number from the already-built
# transaction XDR rather than trusting caller-supplied values (see
# `src/envelope/xdr.rs`). `stellar-xdr` at `22.1` is already in this crate's
# dependency graph transitively, via `stellarconduit-core -> soroban-sdk`, so
# depending on it directly adds no new crate versions to the build — important
# for size-sensitive mobile wallets. Reaching through `soroban-sdk`'s `xdr`
# re-export instead would have pulled the whole Soroban host API into our direct
# surface for no benefit; `stellar-xdr` alone gives us exactly the transaction
# envelope types we need. `default-features = false` with an explicit feature
# set keeps the footprint to just the `curr` XDR types plus base64 decoding.
stellar-xdr = { version = "22.1", default-features = false, features = [
    "std",
    "curr",
    "base64",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.1"

# Cryptography and Identity
#
# `rand_core` must be enabled explicitly: stellarconduit-core's ffi.rs calls
# SigningKey::generate(), which ed25519-dalek only compiles in under this
# feature. Core's own Cargo.toml doesn't request it, and only builds today
# because some other dependency in core's graph happens to enable it via
# Cargo's cross-crate feature unification. That's fragile — a different
# dependency graph (like this crate's, which also pulls in soroban-sdk) can
# resolve without it and break core's build. Requesting it here is a
# workaround on our side; core's manifest should really enable this itself.
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
sha2 = "0.10.8"

# Verifiable Random Function for the last-resort conflict tie-break (issue
# #067, `src/conflict/vrf_tiebreak.rs`). `schnorrkel` is the VRF behind
# Substrate/Polkadot BABE block production — a direct analogue of a
# deterministic "who wins this slot" lottery — is w3f-maintained and has been
# externally audited, and is built on the same `curve25519-dalek` 4.x backend
# `ed25519-dalek` already pulls in, so it adds no second elliptic-curve
# implementation to the build (the mobile-wallet size constraint noted for
# `stellar-xdr` above applies just as much here). The evaluator's VRF keypair
# is derived deterministically from its existing ed25519 signing seed via
# `MiniSecretKey::expand(ExpansionMode::Ed25519)`, so one relay identity maps
# to exactly one VRF key — nothing new to distribute or register. Default
# features keep `getrandom` on, which schnorrkel's proof-blinding nonce
# needs; the VRF *output* (and therefore the tie-break winner) stays fully
# deterministic — only the proof's zero-knowledge blinding is randomized.
schnorrkel = "0.11"

# Encryption at rest for sensitive database columns
# Uses AES-256-GCM for authenticated encryption with additional data (AEAD)
aes-gcm = "0.10"
# Key derivation from user passphrase using Argon2 (memory-hard PBKDF)
argon2 = "0.5"
# Cryptographically secure random number generation
rand_chacha = "0.3"

# Stellar StrKey (SEP-0023) encoding/decoding — official Stellar Development
# Foundation tooling. Used to turn the raw ed25519 `origin_pubkey` carried on
# every `TransactionEnvelope` into the `G...`-prefixed account address the
# `dispute-resolver` Soroban contract's `Address` parameters expect (see
# `src/stellar_address.rs`). This is the well-specified encoding step only —
# not a place to hand-roll CRC16/base32 logic. `default-features = false`
# keeps it to its minimal `heapless` + `data-encoding` footprint; the
# `cli`/`serde` features would pull in `clap`, `serde_json`, and `thiserror`
# that this crate has no use for.
stellar-strkey = { version = "0.0.16", default-features = false }

# Async runtime
tokio = { version = "1.37", features = ["full"] }

# Persistence
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-rusqlite = "0.5"

# Utilities
thiserror = "1.0"
chrono = "0.4"
hex = "0.4"
log = "0.4"
env_logger = "0.11"

# Seeded and entropy-backed RNG for the Laplace mechanism in
# `src/metrics.rs` (privacy-preserving metrics export). We sample
# Laplace(b = Δ/ε) noise in-process rather than taking on a specialised
# differential-privacy crate: the mechanism is a dozen lines, the
# calibration is documented against this crate's actual counter
# sensitivity, and `StdRng` gives reproducible tests via a seed plus
# production entropy via `from_entropy`. `0.8` is already in this crate's
# graph (tests, examples, and `ed25519-dalek`).
rand = "0.8.5"

# Post-Quantum Cryptography
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"

# CLI argument parsing for `src/bin/sync-engine-cli.rs`. Must live in
# `[dependencies]`, not `[dev-dependencies]`: dev-dependencies are only linked
# for `cargo test`/`--examples`/`--benches`, not for a crate's own `[[bin]]`
# targets under a normal `cargo build`.
clap = { version = "4.5", features = ["derive"] }

# JSON rendering for `sync-engine-cli --json`.
serde_json = "1.0"

# Arbitrary-precision integers for the Wesolowski VDF reference
# implementation in `src/queue/vdf_ordering.rs` (issue #64): modular
# squaring over an RSA-style modulus, and the Fiat-Shamir proof built on top
# of it, both need unbounded-size integers. The "rand" feature enables
# `RandBigInt` (used only for local modulus/prime generation, never for
# anything that must be deterministic between prover and verifier).
num-bigint = { version = "0.4", features = ["rand"] }

# Pure-Rust DEFLATE for at-rest envelope compression (issue #56) and its
# compression-oracle side-channel mitigation (issue #93,
# `src/storage/envelope_compression.rs`). Chosen over `zstd`/`lz4`: those add a
# C toolchain dependency (or a large pure-Rust port) that the mobile-wallet
# size constraint this manifest repeatedly cites cannot absorb, and DEFLATE's
# LZ77 + Huffman is the *canonical* compression-oracle target — running the
# CRIME/BREACH-style measurement harness against it keeps our numbers directly
# comparable to the published literature. `miniz_oxide` is what `flate2`'s
# default backend already is, is `no_std`-friendly, and adds no new transitive
# crates of note. Default features (`with-alloc`) give the `compress_to_vec` /
# `decompress_to_vec_with_limit` one-shot helpers this crate uses.
miniz_oxide = "0.8"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
tempfile = "3.27"

# Property-based testing for conflict detection and the settlement state
# machine. Chosen over quickcheck: proptest ships built-in shrinking (failures
# reduce to a minimal reproducing case instead of a raw random seed) and a
# richer combinator API (`prop::collection::vec`, `prop_oneof!`) for composing
# the QueuedSlot generators these tests need.
proptest = "1.5"

# Benchmark harness for benches/*.rs (throughput of conflict detection, queue
# push/pop, and storage operations). Declared here because the benches
# themselves were added in a prior PR without this dependency, which left
# `cargo clippy --all-targets` / `cargo test --workspace` unable to compile.
criterion = "0.5"


[[test]]
name = "queue_storage_roundtrip_test"
path = "tests/integration/queue_storage_roundtrip_test.rs"

[[test]]
name = "engine_restart_test"
path = "tests/integration/engine_restart_test.rs"

[[test]]
name = "cli_test"
path = "tests/integration/cli_test.rs"

[[test]]
name = "vrf_tiebreak_test"
path = "tests/integration/vrf_tiebreak_test.rs"

[[test]]
name = "proof_compression_test"
path = "tests/integration/proof_compression_test.rs"

[[test]]
name = "reputation_test"
path = "tests/integration/reputation_test.rs"

[[test]]
name = "compression_oracle_test"
path = "tests/integration/compression_oracle_test.rs"

[[test]]
name = "adversarial_agents_test"
path = "tests/sim/adversarial_agents_test.rs"

[[test]]
name = "adversarial_sweep"
path = "tests/sim/adversarial_sweep.rs"

[[bin]]
name = "sync-engine-cli"
path = "src/bin/sync-engine-cli.rs"

# `harness = false` is required for every criterion bench: each file's
# `criterion_main!` macro defines its own `fn main()`, which conflicts with
# the default libtest harness cargo would otherwise inject.
[[bench]]
name = "conflict_detection"
path = "benches/conflict_detection.rs"
harness = false

[[bench]]
name = "queue_throughput"
path = "benches/queue_throughput.rs"
harness = false

[[bench]]
name = "storage_throughput"
path = "benches/storage_throughput.rs"
harness = false
