[package]
name = "stellarconduit-sync-engine"
version = "0.1.0"
edition = "2021"
description = "Offline transaction queue, conflict resolution, and settlement tracking for StellarConduit"
license = "Apache-2.0"

[lib]
# `cdylib` and `staticlib` are needed alongside `rlib` so `src/ffi.rs`'s
# `#[no_mangle] extern "C"` functions are actually exported as linkable
# symbols for mobile consumers: `cdylib` produces the shared object Android/
# JNI links against, `staticlib` produces the archive iOS links against, and
# `rlib` keeps this crate usable as an ordinary Rust dependency (e.g. from
# this crate's own `tests/`). Mirrors `stellarconduit-core`'s `[lib]` section,
# which needs `cdylib` for the same reason (its own `src/ffi.rs`).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Shared mesh envelope types, signing, and relay-chain proofs
stellarconduit-core = { git = "https://github.com/StellarConduit/stellarconduit-core.git", rev = "da4c057" }

# Stellar transaction XDR parsing.
#
# We derive the true source account and sequence number from the already-built
# transaction XDR rather than trusting caller-supplied values (see
# `src/envelope/xdr.rs`). `stellar-xdr` at `22.1` is already in this crate's
# dependency graph transitively, via `stellarconduit-core -> soroban-sdk`, so
# depending on it directly adds no new crate versions to the build — important
# for size-sensitive mobile wallets. Reaching through `soroban-sdk`'s `xdr`
# re-export instead would have pulled the whole Soroban host API into our direct
# surface for no benefit; `stellar-xdr` alone gives us exactly the transaction
# envelope types we need. `default-features = false` with an explicit feature
# set keeps the footprint to just the `curr` XDR types plus base64 decoding.
stellar-xdr = { version = "22.1", default-features = false, features = [
    "std",
    "curr",
    "base64",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.1"

# Cryptography and Identity
#
# `rand_core` must be enabled explicitly: stellarconduit-core's ffi.rs calls
# SigningKey::generate(), which ed25519-dalek only compiles in under this
# feature. Core's own Cargo.toml doesn't request it, and only builds today
# because some other dependency in core's graph happens to enable it via
# Cargo's cross-crate feature unification. That's fragile — a different
# dependency graph (like this crate's, which also pulls in soroban-sdk) can
# resolve without it and break core's build. Requesting it here is a
# workaround on our side; core's manifest should really enable this itself.
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
sha2 = "0.10.8"

# Stellar StrKey (SEP-0023) encoding/decoding — official Stellar Development
# Foundation tooling. Used to turn the raw ed25519 `origin_pubkey` carried on
# every `TransactionEnvelope` into the `G...`-prefixed account address the
# `dispute-resolver` Soroban contract's `Address` parameters expect (see
# `src/stellar_address.rs`). This is the well-specified encoding step only —
# not a place to hand-roll CRC16/base32 logic. `default-features = false`
# keeps it to its minimal `heapless` + `data-encoding` footprint; the
# `cli`/`serde` features would pull in `clap`, `serde_json`, and `thiserror`
# that this crate has no use for.
stellar-strkey = { version = "0.0.16", default-features = false }

# Async runtime
tokio = { version = "1.37", features = ["full"] }

# Persistence
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-rusqlite = "0.5"
tracing = "0.1"

# Utilities
thiserror = "1.0"
chrono = "0.4"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
rand = "0.8.5"
tempfile = "3.27"


clap = { version = "4.5", features = ["derive"] }

# Property-based testing for conflict detection and the settlement state
# machine. Chosen over quickcheck: proptest ships built-in shrinking (failures
# reduce to a minimal reproducing case instead of a raw random seed) and a
# richer combinator API (`prop::collection::vec`, `prop_oneof!`) for composing
# the QueuedSlot generators these tests need.
proptest = "1.5"

# Benchmark harness for benches/*.rs (throughput of conflict detection, queue
# push/pop, and storage operations). Declared here because the benches
# themselves were added in a prior PR without this dependency, which left
# `cargo clippy --all-targets` / `cargo test --workspace` unable to compile.
criterion = "0.5"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }


[[test]]
name = "queue_storage_roundtrip_test"
path = "tests/integration/queue_storage_roundtrip_test.rs"

[[test]]
name = "engine_restart_test"
path = "tests/integration/engine_restart_test.rs"

# `harness = false` is required for every criterion bench: each file's
# `criterion_main!` macro defines its own `fn main()`, which conflicts with
# the default libtest harness cargo would otherwise inject.
[[bench]]
name = "conflict_detection"
path = "benches/conflict_detection.rs"
harness = false

[[bench]]
name = "queue_throughput"
path = "benches/queue_throughput.rs"
harness = false

[[bench]]
name = "storage_throughput"
path = "benches/storage_throughput.rs"
harness = false
