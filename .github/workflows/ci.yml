name: Sync Engine CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-lint:
    name: Format and Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets --all-features -- -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: fmt-and-lint

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: cargo test --workspace

  adversarial-sweep:
    name: Adversarial Byzantine Sweep
    runs-on: ubuntu-latest
    needs: fmt-and-lint
    # Bounded, time-budgeted `#070` sweep alongside the ordinary test job.
    # Raise ADVERSARIAL_SWEEP_SEEDS for a deeper nightly (see src/sim/mod.rs).
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Bounded adversarial seed sweep
        env:
          ADVERSARIAL_SWEEP_SEEDS: "512"
          ADVERSARIAL_SWEEP_BUDGET_SECS: "60"
        run: cargo test --test adversarial_sweep -- --nocapture

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: fmt-and-lint
    # Run on every push to main and on pull_request events so PR authors see
    # results. The comparison step uses benchmark-action to post a comment on
    # the PR with a side-by-side comparison against the base commit's stored
    # results (matching the pattern used by stellarconduit-core).
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks (Criterion JSON output)
        # --message-format=json is not supported by criterion; instead we use
        # the built-in --output-format=bencher flag (compatible with the
        # benchmark-action tool) by setting CRITERION_HOME and relying on the
        # default JSON output written to target/criterion/.
        run: cargo bench --bench queue_throughput --bench storage_throughput --bench conflict_detection --bench zk_spend_proof -- --output-format=bencher 2>&1 | tee bench_output.txt

      - name: Store benchmark results (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Sync Engine Benchmarks
          tool: cargo
          output-file-path: bench_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          # Results are pushed to the gh-pages branch under bench/ so
          # the benchmark history page stays live between PRs.
          # auto-push set to false until gh-pages branch is created
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench

      - name: Compare benchmark results against base (PR only)
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        continue-on-error: true
        with:
          name: Sync Engine Benchmarks
          tool: cargo
          output-file-path: bench_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Post a PR comment with a regression table. A 10 % slowdown on any
          # benchmark is flagged as a warning; 20 % fails the step so the PR
          # cannot merge without explicit author acknowledgement.
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          # Skip fetching the gh-pages branch when no baseline has been stored
          # yet (i.e. the branch does not exist). Without this flag the step
          # fails with "couldn't find remote ref gh-pages" on every PR until
          # at least one push to main has successfully written a baseline —
          # which can never happen while this flag is absent and every PR is
          # blocked. Once a baseline exists on gh-pages this flag is a no-op.
          skip-fetch-gh-pages: true
